<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR | Cuba Eventos</title>
<style>
  :root{font-family:Arial,sans-serif;color:#17121e;background:#fff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff}
  main{text-align:center;width:min(100%,620px)}
  h1{font-size:clamp(28px,6vw,48px);margin:0 0 10px;letter-spacing:0}
  p{font-size:clamp(16px,3vw,22px);margin:0 0 24px}
  .qr{display:block;width:min(78vw,440px);height:auto;margin:0 auto;padding:18px;border:3px solid #17121e;background:#fff}
  a{display:inline-block;margin-top:22px;color:#17121e;font-size:16px;word-break:break-all}
  @media print{body{padding:0}.qr{width:75vw;max-width:500px}a{display:none}}
</style>
</head>
<body>
<main>
  <h1>Cuba Eventos</h1>
  <p>Escaneá para participar</p>
  <img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&amp;data=https%3A%2F%2Fcuba-eventos.web.app%2F" alt="Código QR para abrir el formulario de Cuba Eventos">
  <a href="https://cuba-eventos.web.app/">cuba-eventos.web.app</a>
</main>
</body>
</html>
