<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Datos demo | Cuba Eventos</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#100b18,#251238);color:#f5f0fa;font-family:Arial,sans-serif;padding:20px}.panel{width:min(100%,620px);background:#1d1428;border:1px solid #ffffff22;border-radius:14px;padding:28px;box-shadow:0 20px 60px #0005}h1{margin-top:0}p{color:#b7a9c9;line-height:1.5}.status{min-height:24px;color:#33e1e8}.danger{background:#b52b68}.button{border:0;border-radius:8px;padding:13px 16px;color:#fff;font-weight:bold;cursor:pointer;margin:6px 6px 0 0;background:linear-gradient(100deg,#ff3d9a,#8b5cf6)}button:disabled{opacity:.5;cursor:wait}a{color:#33e1e8}</style></head><body><main class="panel"><h1>Datos demo</h1><p>Esta herramienta crea o elimina únicamente los 35 participantes marcados como demo. No afecta registros reales.</p><div id="login"><button id="loginButton" class="button">Ingresar con Google</button><p id="error"></p></div><section id="tools" hidden><p id="account"></p><button id="seedButton" class="button">Generar 35 demos</button><button id="deleteButton" class="button danger">Borrar demos</button><p id="status" class="status"></p><a href="sorteo.html">Ir al sorteo en vivo</a></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getFirestore,collection,getDocs,addDoc,query,where,deleteDoc,doc}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';const config={apiKey:'AIzaSyAbajks1pTCoB0m0eSQc5dabruDWJ1vog4',authDomain:'cuba-eventos.firebaseapp.com',projectId:'cuba-eventos',storageBucket:'cuba-eventos.firebasestorage.app',messagingSenderId:'504683487458',appId:'1:504683487458:web:724f3fb58f18c25b847ebb'},ADMIN='moyanojl1984@gmail.com',db=getFirestore(initializeApp(config)),auth=getAuth(),provider=new GoogleAuthProvider(),login=document.getElementById('login'),tools=document.getElementById('tools'),status=document.getElementById('status'),demoQuery=()=>getDocs(query(collection(db,'participantes_sorteo'),where('demo','==',true)));document.getElementById('loginButton').onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(error){document.getElementById('error').textContent=error.message}};onAuthStateChanged(auth,user=>{if(user&&user.email===ADMIN){login.hidden=true;tools.hidden=false;document.getElementById('account').textContent=`Sesión: ${user.email}`}else if(user){document.getElementById('error').textContent=`Debés usar ${ADMIN}`}});document.getElementById('seedButton').onclick=async()=>{const button=document.getElementById('seedButton');button.disabled=true;status.textContent='Generando 35 participantes...';try{const old=await demoQuery();await Promise.all(old.docs.map(item=>deleteDoc(doc(db,'participantes_sorteo',item.id))));const names=['Sofía Martínez','Mateo González','Valentina Rodríguez','Santiago López','Camila Fernández','Benjamín Díaz','Martina Sosa','Tomás Romero','Julieta Álvarez','Nicolás Torres','Emma Ruiz','Thiago Acosta','Mía Navarro','Franco Medina','Renata Vega','Lautaro Ríos','Clara Molina','Bautista Castro','Olivia Suárez','Agustín Peralta','Lola Giménez','Facundo Arias','Pilar Méndez','Máximo Cabrera','Ana Luna','Lucas Ferreyra','Malena Ponce','Joaquín Vargas','Zoe Correa','Bruno Benítez','Catalina Silva','Simón Duarte','Abril Quiroga','Valentín Figueroa','Bianca Paz'];await Promise.all(names.map((nombre,index)=>addDoc(collection(db,'participantes_sorteo'),{nombre,fecha_nacimiento:`${1988+index%12}-${String(1+index%12).padStart(2,'0')}-${String(1+(index*3)%27).padStart(2,'0')}`,celular:`11 5555-${String(1000+index).slice(-4)}`,consentimiento_datos:true,acepta_marketing:index%2===0,demo:true,creado:new Date()})));status.textContent='Listo: se generaron 35 participantes demo.'}catch(error){status.textContent=`Error: ${error.message}`}finally{button.disabled=false}};document.getElementById('deleteButton').onclick=async()=>{if(!confirm('¿Borrar los participantes demo?'))return;const button=document.getElementById('deleteButton');button.disabled=true;status.textContent='Borrando demos...';try{const snapshot=await demoQuery();await Promise.all(snapshot.docs.map(item=>deleteDoc(doc(db,'participantes_sorteo',item.id))));status.textContent=`Listo: se borraron ${snapshot.size} participantes demo.`}catch(error){status.textContent=`Error: ${error.message}`}finally{button.disabled=false}};</script></body></html>
