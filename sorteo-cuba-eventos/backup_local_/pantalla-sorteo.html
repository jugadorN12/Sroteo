<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteo en vivo | Cuba Eventos</title>
<style>
:root{--pink:#ff3d9a;--cyan:#33e1e8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(700px 500px at 15% 0,#ff3d9a55,transparent 60%),radial-gradient(600px 500px at 100% 100%,#33e1e844,transparent 60%),#100b18;color:#fff;font-family:Arial,sans-serif;text-align:center}
.wrap{width:min(92vw,1100px);position:relative;z-index:2}
#logo{display:block;max-width:min(70vw,360px);max-height:150px;object-fit:contain;margin:0 auto 18px;border-radius:10px}
.eyebrow{color:var(--cyan);font-size:clamp(12px,1.5vw,18px);font-weight:bold;letter-spacing:.2em;text-transform:uppercase}
h1{font-size:clamp(42px,8vw,110px);line-height:.9;margin:14px 0 28px;text-transform:uppercase}
#meta{color:#b7a9c9;font-size:clamp(15px,2vw,24px);min-height:30px}
.countdown{font-size:clamp(60px,13vw,170px);font-weight:bold;line-height:1;color:#fff;text-shadow:0 0 35px #33e1e8aa;letter-spacing:.03em}
.countdown-label{color:#b7a9c9;font-size:clamp(16px,2.5vw,30px);margin-top:18px}
.wheel{height:clamp(145px,24vw,280px);display:grid;place-items:center;margin:25px 0;border-top:2px solid #ffffff33;border-bottom:2px solid #ffffff33;overflow:hidden;position:relative;background:#ffffff0d}
.wheel:before,.wheel:after{content:'';position:absolute;left:0;right:0;height:35%;z-index:2;pointer-events:none}.wheel:before{top:0;background:linear-gradient(#100b18,transparent)}.wheel:after{bottom:0;background:linear-gradient(transparent,#100b18)}
#name{font-size:clamp(40px,8vw,108px);font-weight:bold;position:relative;z-index:3;text-shadow:0 0 30px #ff3d9a99}#name.spinning{animation:jitter .09s linear infinite}
@keyframes jitter{0%{transform:translateY(-9px) rotate(-1deg)}50%{transform:translateY(8px) rotate(1deg)}100%{transform:translateY(-4px)}}
#winner{display:none}.winner-label{color:var(--pink);font-weight:bold;font-size:clamp(20px,3vw,42px);letter-spacing:.15em;text-transform:uppercase}.winner-name{font-size:clamp(70px,15vw,220px);font-weight:900;line-height:.95;margin:22px 0;color:#fff;text-shadow:0 0 35px #ff3d9a}.number{color:var(--cyan);font-size:clamp(20px,3vw,36px)}
.waiting{color:#b7a9c9;font-size:clamp(18px,3vw,34px)}
</style>
</head>
<body>
<main class="wrap"><img id="logo" alt="Logo del boliche" hidden><div class="eyebrow">Cuba Eventos presenta</div><h1>¡Sorteo en vivo!</h1><section id="waiting" class="waiting">Esperando el próximo sorteo...</section><section id="countdownView" hidden><div class="countdown" id="countdown">10:00.000</div><div class="countdown-label">El sorteo comienza en</div></section><section id="game" hidden><div id="meta"></div><div class="wheel"><div id="name"></div></div></section><section id="winner"><div class="winner-label">¡Persona ganadora!</div><div class="winner-name" id="winnerName"></div><div class="number" id="winnerNumber"></div></section></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getFirestore,doc,onSnapshot}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const config={apiKey:'AIzaSyAbajks1pTCoB0m0eSQc5dabruDWJ1vog4',authDomain:'cuba-eventos.firebaseapp.com',projectId:'cuba-eventos',storageBucket:'cuba-eventos.firebasestorage.app',messagingSenderId:'504683487458',appId:'1:504683487458:web:724f3fb58f18c25b847ebb'};
const db=getFirestore(initializeApp(config)),waiting=document.getElementById('waiting'),countdownView=document.getElementById('countdownView'),game=document.getElementById('game'),name=document.getElementById('name'),winner=document.getElementById('winner'),countdown=document.getElementById('countdown'),logo=document.getElementById('logo');
let timer,runId=0,activeStartAt=null;
function resetScreen(){winner.style.display='none';game.hidden=true;countdownView.hidden=true;waiting.hidden=false;name.textContent='';}
function reveal(entries,index){
  const selected=entries[index];
  if(!selected)return;
  game.hidden=true;
  countdownView.hidden=true;
  waiting.hidden=true;
  winner.style.display='block';
  document.getElementById('winnerName').textContent=selected.nombre;
  document.getElementById('winnerNumber').textContent=`Participante #${selected.numero}`;

  // Registrar el ganador en Firestore para que no vuelva a ganar
  import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(m => {
    m.updateDoc(m.doc(db, 'participantes_sorteo', selected.id), { ya_gano: true });
  });

  window.setTimeout(resetScreen, 8000);
}
function startRoll(data){
  const id=++runId,entries=data.entries||[];
  const rollDuration = data.duration || 7000;
  waiting.hidden=true;
  countdownView.hidden=true;
  game.hidden=false;
  winner.style.display='none';
  document.getElementById('meta').textContent=`${entries.length} participantes en juego`;
  name.classList.add('spinning');
  let position=0;
  clearInterval(timer);
  timer=setInterval(()=>{name.textContent=entries[position++%entries.length].nombre},80);
  setTimeout(()=>{
    if(id!==runId)return;
    clearInterval(timer);
    name.classList.remove('spinning');
    name.textContent=entries[data.winnerIndex].nombre;
    setTimeout(()=>reveal(entries,data.winnerIndex),500)
  }, rollDuration)
}
onSnapshot(doc(db,'sorteo','actual'),snapshot=>{
  if(!snapshot.exists())return;
  const data=snapshot.data();
  if(data.status === 'idle') { resetScreen(); return; }
  if(data.logoUrl){logo.src=data.logoUrl;logo.hidden=false}else logo.hidden=true;
  const entries=data.entries||[];

  // Manejo de Sorteo Express o Cuenta Regresiva
  if(data.status === 'express') {
    if(String(data.startAt)===String(activeStartAt)) return;
    activeStartAt=data.startAt;
    startRoll(data);
    return;
  }

  if(data.status!=='countdown'||!entries.length)return;
  if(String(data.startAt)===String(activeStartAt))return;
  activeStartAt=data.startAt;
  waiting.hidden=true;
  game.hidden=true;
  winner.style.display='none';
  countdownView.hidden=false;
  const start=Number(data.startAt);
  clearInterval(timer);
  const tick=()=>{
    const remaining=Math.max(0,start-Date.now()),minutes=Math.floor(remaining/60000),seconds=Math.floor(remaining%60000/1000),milliseconds=remaining%1000;
    countdown.textContent=`${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}.${String(milliseconds).padStart(3,'0')}`;
    if(remaining<=0){clearInterval(timer);startRoll(data)}
  };
  tick();
  timer=setInterval(tick,37)
});
</script>
</body>
</html>
