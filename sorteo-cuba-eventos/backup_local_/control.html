<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Control de Sorteo | Cuba Eventos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0713;
    --card: rgba(255, 255, 255, 0.05);
    --pink: #FF3D9A;
    --cyan: #33E1E8;
    --violet: #8B5CF6;
    --ink: #F5F0FA;
    --font-body: 'Work Sans', sans-serif;
    --font-display: 'Big Shoulders Display', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #0B0713, #1A0F2E);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    padding: 20px;
  }
  header { text-align: center; margin-bottom: 30px; }
  .eyebrow { color: var(--cyan); font-size: 12px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; }
  h1 { font-family: var(--font-display); font-size: 42px; margin: 5px 0; text-transform: uppercase; }

  .status-bar {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 25px;
    text-align: center;
  }
  #statusText { font-weight: 700; color: var(--cyan); }
  #participantCount { font-size: 13px; color: #B7A9C9; margin-top: 5px; }

  .control-group { display: flex; flex-direction: column; gap: 15px; }

  .input-field {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 15px;
    padding: 20px;
  }
  label { display: block; font-size: 13px; margin-bottom: 10px; color: #B7A9C9; }
  input[type="number"] {
    width: 100%;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--cyan);
    color: white;
    font-size: 24px;
    text-align: center;
    border-radius: 10px;
    padding: 10px;
    font-family: var(--font-display);
  }

  button {
    width: 100%;
    padding: 22px;
    border-radius: 18px;
    border: none;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 18px;
    color: white;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-primary { background: linear-gradient(100deg, var(--pink), var(--violet)); box-shadow: 0 8px 25px rgba(255, 61, 154, 0.3); }
  .btn-express { background: linear-gradient(100deg, var(--cyan), var(--violet)); box-shadow: 0 8px 25px rgba(51, 225, 232, 0.2); margin-top: 10px; }
  .btn-reset { background: transparent; border: 1.5px solid rgba(255,255,255,0.2); color: #B7A9C9; margin-top: 20px; font-size: 14px; padding: 15px; }

  .footer { margin-top: auto; text-align: center; padding: 20px 0; font-size: 12px; color: #5C5470; }

  #loginView { text-align: center; padding-top: 50px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Control Remoto</div>
  <h1>Cuba Eventos</h1>
</header>

<div id="loginView">
  <p>Debés ser administrador para operar el sorteo.</p>
  <button id="loginButton" class="btn-primary">Ingresar con Google</button>
</div>

<div id="controlView" hidden>
  <div class="status-bar">
    <div id="statusText">SISTEMA LISTO</div>
    <div id="participantCount">Cargando participantes...</div>
  </div>

  <div class="control-group">
    <div class="input-field">
      <label for="minutes">Minutos de cuenta regresiva</label>
      <input type="number" id="minutes" value="10" min="1" max="60">
    </div>

    <button id="startBtn" class="btn-primary">INICIAR CUENTA REGRESIVA</button>
    <button id="expressBtn" class="btn-express">SORTEO EXPRESS (15s)</button>

    <button id="resetBtn" class="btn-reset">CANCELAR Y RESETEAR</button>
  </div>
</div>

<div class="footer">
  &copy; 2026 Cuba Eventos - Modo Operador
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getFirestore, doc, setDoc, collection, getDocs, onSnapshot, query, where, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

  const firebaseConfig = {
    apiKey: 'AIzaSyAbajks1pTCoB0m0eSQc5dabruDWJ1vog4',
    authDomain: 'cuba-eventos.firebaseapp.com',
    projectId: 'cuba-eventos',
    storageBucket: 'cuba-eventos.firebasestorage.app',
    messagingSenderId: '504683487458',
    appId: '1:504683487458:web:724f3fb58f18c25b847ebb'
  };

  const ADMIN_EMAILS = ['moyanojl1984@gmail.com', 'gncesso@gmail.com'];
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  const loginView = document.getElementById('loginView');
  const controlView = document.getElementById('controlView');
  const statusText = document.getElementById('statusText');
  const participantCount = document.getElementById('participantCount');
  const startBtn = document.getElementById('startBtn');
  const expressBtn = document.getElementById('expressBtn');
  const resetBtn = document.getElementById('resetBtn');

  // Lógica de Autenticación con Bypass para Desarrollo Local
  onAuthStateChanged(auth, user => {
    const isLocal = window.location.protocol === 'file:' || window.location.hostname === 'localhost';

    if (isLocal) {
      console.log("Modo Desarrollador Activo: Bypass de autenticación");
      loginView.hidden = true;
      controlView.hidden = false;
      initApp();
      return;
    }

    if (user && ADMIN_EMAILS.includes(user.email)) {
      loginView.hidden = true;
      controlView.hidden = false;
      initApp();
    } else {
      loginView.hidden = false;
      controlView.hidden = true;
    }
  });

  document.getElementById('loginButton').onclick = () => signInWithPopup(auth, provider);

  async function initApp() {
    // Escuchar estado actual del sorteo
    onSnapshot(doc(db, 'sorteo', 'actual'), (snap) => {
      if (!snap.exists()) {
        statusText.textContent = "SISTEMA LISTO";
        statusText.style.color = "var(--cyan)";
        return;
      }
      const data = snap.data();
      if (data.status === 'countdown') {
        statusText.textContent = "EN CUENTA REGRESIVA";
        statusText.style.color = "var(--pink)";
      } else if (data.status === 'spinning') {
        statusText.textContent = "SORTEANDO...";
        statusText.style.color = "var(--cyan)";
      } else {
        statusText.textContent = "ESPERANDO";
        statusText.style.color = "white";
      }
    });

    // Contar participantes "de buena fe" (que no ganaron)
    const q = query(collection(db, 'participantes_sorteo'), where('ya_gano', '!=', true));
    onSnapshot(q, (snap) => {
      participantCount.textContent = `${snap.size} personas listas para ganar`;
      startBtn.disabled = snap.empty;
      expressBtn.disabled = snap.empty;
    });
  }

  async function prepareDraw(mode) {
    statusText.textContent = "PREPARANDO...";
    const snapshot = await getDocs(query(collection(db, 'participantes_sorteo'), where('ya_gano', '!=', true)));
    const entries = snapshot.docs.map((d, i) => ({ id: d.id, nombre: d.data().nombre, numero: i + 1 }));

    if (entries.length === 0) return alert("No hay participantes habilitados.");

    const winnerIndex = Math.floor(Math.random() * entries.length);
    const logoConfig = await getDocs(collection(db, 'sorteo', 'configuracion')); // Omitido por brevedad, asumimos default

    const minutes = parseInt(document.getElementById('minutes').value) || 10;

    await setDoc(doc(db, 'sorteo', 'actual'), {
      status: mode === 'express' ? 'express' : 'countdown',
      entries,
      winnerIndex,
      startAt: mode === 'express' ? Date.now() : Date.now() + (minutes * 60000),
      duration: mode === 'express' ? 15000 : 7000
    });
  }

  startBtn.onclick = () => prepareDraw('normal');
  expressBtn.onclick = () => {
    if(confirm("¿Iniciar sorteo express ahora mismo? (15s de giro)")) prepareDraw('express');
  };

  resetBtn.onclick = async () => {
    if(confirm("¿Estás seguro de resetear el sorteo actual?")) {
      await setDoc(doc(db, 'sorteo', 'actual'), { status: 'idle', entries: [] });
    }
  };

</script>
</body>
</html>
